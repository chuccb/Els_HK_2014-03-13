<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elsword HK 2014-03-13 (web)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root { --bg: #14161c; --panel: #1b1e27; --line: #2a2f3c; --fg: #d8dce6; --dim: #8b93a7; --accent: #6aa9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 360px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 22px; height: 100%; }
  aside { grid-row: 1; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  aside h1 { margin: 0; padding: 10px 12px 2px; font-size: 14px; font-weight: 600; }
  aside .sub { padding: 0 12px 8px; color: var(--dim); font-size: 11px; }
  aside input[type=search] { margin: 0 12px 6px; padding: 6px 8px; background: #0f1116; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 6px; }
  .chips button { background: #0f1116; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; cursor: pointer; font-size: 11px; }
  .chips button.on { color: var(--fg); border-color: var(--accent); }
  .count { padding: 0 12px 4px; color: var(--dim); font-size: 11px; }
  .list { flex: 1; overflow-y: auto; min-height: 0; border-top: 1px solid var(--line); outline: none; }
  .item { display: flex; justify-content: space-between; gap: 8px; padding: 2px 12px; cursor: pointer; white-space: nowrap; }
  .item span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .item .dim { flex: none; }
  .item:hover { background: #232838; }
  .item.sel { background: #26406b; }
  main { grid-row: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  main header { padding: 8px 14px; border-bottom: 1px solid var(--line); min-height: 52px; }
  main header .name { font-weight: 600; font-size: 14px; word-break: break-all; }
  main header .info { color: var(--dim); font-size: 12px; }
  #view { flex: 1; min-height: 0; position: relative; }
  #status { grid-column: 1 / 3; grid-row: 2; background: #0f1116; border-top: 1px solid var(--line); padding: 2px 12px; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .pane { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .pane.scroll { overflow: auto; display: block; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 6px 14px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .bar select, .bar button { background: #0f1116; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
  .imgwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 8px; }
  .imgwrap canvas { background: #000; }
  canvas.checker { background: repeating-conic-gradient(#3a3f4d 0% 25%, #2b2f3a 0% 50%) 50% / 16px 16px; }
  canvas.fit { max-width: 100%; max-height: 100%; object-fit: contain; }
  canvas.pixelated { image-rendering: pixelated; }
  canvas.movie { width: 800px; max-width: 100%; image-rendering: auto; }
  .glwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #0d0f14; }
  canvas.gl { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: grab; }
  pre.text { margin: 0; padding: 10px 14px; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre; color: #cdd3e0; }
  .welcome { padding: 24px 28px; max-width: 760px; }
  .welcome h2 { margin-top: 0; }
  .welcome a { color: var(--accent); cursor: pointer; }
  .err { color: #ff8a8a; white-space: pre-wrap; padding: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/client.js"></script>
</body>
</html>
